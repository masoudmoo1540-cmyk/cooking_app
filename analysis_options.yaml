include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    experimental: ignore
    invalid_use_of_internal_member: ignore
    unnecessary_null_comparison: ignore
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

linter:
  rules:
    avoid_print: false