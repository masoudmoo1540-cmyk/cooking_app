name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate android folder
        run: flutter create --platforms=android --org com.example --project-name cooking_app .

      - name: Show build.gradle.kts
        run: cat android/app/build.gradle.kts

      - name: Force compileSdk 36
        run: |
          python3 - <<'EOF'
          import re
          path = "android/app/build.gradle.kts"
          with open(path, "r", encoding="utf-8") as f:
              content = f.read()
          content = re.sub(r'compileSdk\s*=\s*[^\n]+', 'compileSdk = 36', content)
          content = re.sub(r'compileSdkVersion\s*[^\n]+', 'compileSdkVersion 36', content)
          content = re.sub(r'minSdk\s*=\s*[^\n]+', 'minSdk = 21', content)
          content = re.sub(r'minSdkVersion\s*[^\n]+', 'minSdkVersion 21', content)
          content = re.sub(r'targetSdk\s*=\s*[^\n]+', 'targetSdk = 36', content)
          content = re.sub(r'targetSdkVersion\s*[^\n]+', 'targetSdkVersion 36', content)
          with open(path, "w", encoding="utf-8") as f:
              f.write(content)
          print("=== AFTER ===")
          print(content)
          EOF

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cooking-app-apk
          path: build/app/outputs/flutter-apk/app-release.apk