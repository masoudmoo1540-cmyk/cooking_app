name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate android folder
        run: flutter create --platforms=android --org com.example --project-name cooking_app .

      - name: Set compileSdk and minSdk
        run: |
          echo "=== BEFORE ==="
          cat android/app/build.gradle.kts
          echo "=== AFTER ==="
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 34/g' android/app/build.gradle.kts
          sed -i 's/compileSdkVersion .*/compileSdkVersion 34/g' android/app/build.gradle.kts
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/g' android/app/build.gradle.kts
          sed -i 's/minSdkVersion .*/minSdkVersion 21/g' android/app/build.gradle.kts
          sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 34/g' android/app/build.gradle.kts
          sed -i 's/targetSdkVersion .*/targetSdkVersion 34/g' android/app/build.gradle.kts
          cat android/app/build.gradle.kts

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cooking-app-apk
          path: build/app/outputs/flutter-apk/app-release.apk